name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      source-db:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: source-test-pass
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

      target-db:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: target-test-pass
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      # --prove needs a pg_dump at least as new as the newest server it copies:
      # the proof's tests include a PostgreSQL 18 target.
      - name: Install PostgreSQL client 18
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: Seed source database
        run: |
          PGPASSWORD=source-test-pass psql -h localhost -p 15432 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f packages/cli/tests/fixtures/seed-source.sql

      - name: Seed target database
        run: |
          PGPASSWORD=target-test-pass psql -h localhost -p 15433 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f packages/cli/tests/fixtures/seed-target.sql

      - name: Run integration tests
        working-directory: packages/cli
        env:
          SUPAFORGE_TEST_SOURCE_URL: postgresql://postgres:source-test-pass@localhost:15432/postgres
          SUPAFORGE_TEST_TARGET_URL: postgresql://postgres:target-test-pass@localhost:15433/postgres
        run: npx vitest run --config vitest.integration.config.ts

      # The CLI end-to-end tests that need real databases. The unit job has
      # none, so these skip there; reseeded first, since the integration
      # tests above apply fixes to the target.
      - name: Reseed databases
        run: |
          PGPASSWORD=source-test-pass psql -h localhost -p 15432 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f packages/cli/tests/fixtures/seed-source.sql
          PGPASSWORD=target-test-pass psql -h localhost -p 15433 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f packages/cli/tests/fixtures/seed-target.sql

      - name: Run CLI end-to-end tests against the databases
        working-directory: packages/cli
        env:
          SUPAFORGE_TEST_SOURCE_URL: postgresql://postgres:source-test-pass@localhost:15432/postgres
          SUPAFORGE_TEST_TARGET_URL: postgresql://postgres:target-test-pass@localhost:15433/postgres
        run: npx vitest run test/e2e
