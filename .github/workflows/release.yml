name: Release

# Invoked only via workflow_call from manual-release.yml (which bumps the
# version, pushes the tag, then calls this). A previous `on: push: tags`
# trigger caused a second, concurrent run per release that raced the
# workflow_call run and failed with npm E409 "cannot publish over existing
# version" — the source of the flaky red releases.
on:
  workflow_call:
    inputs:
      tag_name:
        description: The version tag to release (e.g. v1.2.3)
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Lint
        working-directory: packages/cli
        run: npm run lint

      - name: Test
        working-directory: packages/cli
        run: npm test

      - name: Build
        working-directory: packages/cli
        run: npm run build

  # Fail fast on an expired/invalid npm token *before* anything is published or
  # a GitHub Release is created. npm publish itself is the only step that
  # authenticates, so without this a bad token would surface late — after a
  # release already exists for a version that never reached npm.
  verify-npm-token:
    name: Verify npm token
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm whoami --registry=https://registry.npmjs.org; then
            echo "NPM_TOKEN is valid."
          else
            echo "::error::NPM_TOKEN is missing, expired, or invalid — aborting the release before publishing."
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Depend on publish-npm so the GitHub Release is only created once the
    # version is actually live on npm — never a release announcing a version
    # that failed to publish.
    needs: [build-and-test, verify-npm-token, publish-npm]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" == *"-rc."* ]] || [[ "$TAG" == *"-beta."* ]] || [[ "$TAG" == *"-alpha."* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-and-test, verify-npm-token]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build
        working-directory: packages/cli
        run: npm run build

      # Nothing ships that is not on the allow-list, over budget, or broken
      # once installed from the tarball.
      - name: Check the package
        working-directory: packages/cli
        run: node scripts/check-package.mjs

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" == *"-rc."* ]] || [[ "$TAG" == *"-beta."* ]] || [[ "$TAG" == *"-alpha."* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          out=$(npm publish --provenance --tag ${{ steps.dist-tag.outputs.tag }} 2>&1); code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            if echo "$out" | grep -qiE 'E409|cannot publish over|already exists'; then
              echo "Version already published to npm — treating as success (idempotent)."
            else
              exit "$code"
            fi
          fi
