name: Security & Package

# Dependency advisories, dependency changes on PRs, and what the published
# package actually contains. Runs on every PR and push to main, and weekly so
# an advisory published after a merge is caught without waiting for a change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [cli, mcp, vscode]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Any advisory, at any severity, dev tooling included: directories that
      # list MCP servers want a clean scan, and an advisory left at "moderate"
      # is one nobody gets round to. Fix it with a dependency update or, when
      # the parent pins an old range, an `overrides` entry in package.json.
      # What a user installs is checked separately, from the packed tarball, by
      # the package job: overrides here never reach them.
      - name: All dependencies, any severity
        run: npm audit

  # Flags a PR that adds or upgrades a dependency into a known advisory, before
  # it merges — npm audit only sees the lockfile once it already has.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  package:
    name: Package contents & size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - run: npm ci
      - run: npm run build

      # Allow-list of shipped files, size budgets, then install the tarball
      # into an empty directory, run it, and audit that install against
      # scripts/audit-exceptions.json.
      - name: Check the package
        run: node scripts/check-package.mjs
