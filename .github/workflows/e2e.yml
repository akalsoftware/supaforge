name: E2E Tests (Supabase)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual trigger for debugging
  workflow_dispatch:

permissions:
  contents: read
  # Pulling Supabase's images from ghcr.io anonymously is rate limited per
  # runner IP and shared with every other job on it, which failed this workflow
  # as `toomanyrequests` for reasons unrelated to the change under test.
  # Authenticated pulls have a far higher ceiling.
  packages: read

jobs:
  e2e:
    name: E2E tests (Supabase local)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      # v3 resolves the CLI from the npm registry. v1 resolved it from the
      # GitHub releases API, which is rate limited to 60 requests an hour per
      # runner IP for unauthenticated callers — shared across every job on that
      # runner, so this failed as "rate limit exceeded" for reasons that had
      # nothing to do with the change under test. The v1 tag no longer exists
      # upstream either.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned: `latest` became CLI 3.0.0 on 2026-11-02, which refuses the
          # [inbucket] section these stacks' config.toml still uses, and every
          # pull request's e2e job failed before running a test. Move to 3.x
          # deliberately, with the config migrated, rather than by surprise.
          version: 2.122.1

      # Raises the ghcr.io pull ceiling. Never fails the job: an anonymous pull
      # still works, it is only more likely to be throttled.
      - name: Authenticate image pulls
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::ghcr login failed — pulls will be anonymous"

      # --prove needs a pg_dump at least as new as the server. Without one it
      # steps aside, and yy-cli-prove would pass having proved nothing.
      - name: Install PostgreSQL client 18
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      # Retried: a throttled pull and a port still held by a rolled-back start
      # both fail here and both clear in seconds. See the script for detail.
      - name: Start source instance
        run: packages/cli/scripts/ci-supabase-start.sh packages/cli/tests/e2e/supabase-source

      - name: Start target instance
        run: packages/cli/scripts/ci-supabase-start.sh packages/cli/tests/e2e/supabase-target

      # Extract connection info
      - name: Get source status
        id: source
        working-directory: packages/cli/tests/e2e/supabase-source
        run: |
          echo "DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "SERVICE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Get target status
        id: target
        working-directory: packages/cli/tests/e2e/supabase-target
        run: |
          echo "DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "SERVICE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"

      # Seed databases
      - name: Seed source database
        run: |
          psql "${{ steps.source.outputs.DB_URL }}" \
            -v ON_ERROR_STOP=1 \
            -f packages/cli/tests/e2e/fixtures/seed-source.sql

      - name: Seed target database
        run: |
          psql "${{ steps.target.outputs.DB_URL }}" \
            -v ON_ERROR_STOP=1 \
            -f packages/cli/tests/e2e/fixtures/seed-target.sql

      # Create storage buckets via API
      - name: Seed source storage buckets
        run: |
          API="${{ steps.source.outputs.API_URL }}"
          KEY="${{ steps.source.outputs.SERVICE_KEY }}"
          curl -sf -X POST "${API}/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"avatars","name":"avatars","public":true,"file_size_limit":10485760}'
          curl -sf -X POST "${API}/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"documents","name":"documents","public":false}'

      - name: Seed target storage buckets (drifted)
        run: |
          API="${{ steps.target.outputs.API_URL }}"
          KEY="${{ steps.target.outputs.SERVICE_KEY }}"
          curl -sf -X POST "${API}/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"avatars","name":"avatars","public":false,"file_size_limit":10485760}'
          curl -sf -X POST "${API}/storage/v1/bucket" \
            -H "Authorization: Bearer ${KEY}" -H "apikey: ${KEY}" \
            -H "Content-Type: application/json" \
            -d '{"id":"backups","name":"backups","public":false}'

      # Run E2E tests
      - name: Run E2E tests
        working-directory: packages/cli
        env:
          SUPAFORGE_E2E_SOURCE_DB_URL: ${{ steps.source.outputs.DB_URL }}
          SUPAFORGE_E2E_TARGET_DB_URL: ${{ steps.target.outputs.DB_URL }}
          SUPAFORGE_E2E_SOURCE_API_URL: ${{ steps.source.outputs.API_URL }}
          SUPAFORGE_E2E_TARGET_API_URL: ${{ steps.target.outputs.API_URL }}
          SUPAFORGE_E2E_SOURCE_SERVICE_KEY: ${{ steps.source.outputs.SERVICE_KEY }}
          SUPAFORGE_E2E_TARGET_SERVICE_KEY: ${{ steps.target.outputs.SERVICE_KEY }}
        run: npx vitest run --config vitest.e2e.config.ts

      # Cleanup (best-effort)
      - name: Stop Supabase instances
        if: always()
        run: |
          cd packages/cli/tests/e2e/supabase-source && supabase stop --no-backup || true
          cd packages/cli/tests/e2e/supabase-target && supabase stop --no-backup || true
