name: Release Dry Run

# Validates the release pipeline without publishing anything: verifies the
# NPM_TOKEN with an authenticated `npm whoami`, builds the CLI, and runs
# `npm publish --dry-run` to confirm the tarball packs correctly.
#
# Run it on demand (Actions → Release Dry Run → Run workflow) before cutting a
# release, or any time you want to confirm the npm token is still valid. It also
# runs automatically on PRs that touch the release pipeline.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/manual-release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'packages/cli/package.json'
      - 'packages/cli/package-lock.json'
      - 'scripts/release.js'

permissions:
  contents: read

jobs:
  dry-run:
    name: Verify token, build & pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      # `npm publish --dry-run` never authenticates, so it cannot tell us whether
      # NPM_TOKEN is still valid. `npm whoami` makes a real authenticated call and
      # fails fast if the token is missing/expired — the same check the real
      # release now gates on.
      - name: Verify NPM_TOKEN (authenticated whoami)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Same-repo PRs and workflow_dispatch have the secret; fork PRs don't.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN available (likely a fork PR) — skipping token check."
            exit 0
          fi
          if npm whoami --registry=https://registry.npmjs.org; then
            echo "✅ NPM_TOKEN is valid (authenticated as the user above)."
          else
            echo "::error::NPM_TOKEN is missing, expired, or invalid — the real release would fail at publish."
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build
        working-directory: packages/cli
        run: npm run build

      # Nothing ships that is not on the allow-list, over budget, or broken
      # once installed from the tarball.
      - name: Check the package
        working-directory: packages/cli
        run: node scripts/check-package.mjs

      - name: npm publish --dry-run
        working-directory: packages/cli
        run: npm publish --dry-run --tag next

      # What release.yml sends the MCP Registry, checked by the registry itself.
      - name: Validate server.json
        working-directory: packages/cli
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          jq --arg n "$(node -p "require('./package.json').mcpName")" -e '.name == $n' server.json >/dev/null \
            || { echo "::error::server.json name does not match package.json mcpName"; exit 1; }
          ./mcp-publisher validate

      # The Claude Desktop extension build, on the version already on npm.
      - name: Build a Claude Desktop extension
        working-directory: packages/cli
        run: scripts/build-mcpb.sh "$(npm view @akal/supaforge version)" linux-x64 "$RUNNER_TEMP/mcpb"

      # The package as a user gets it: packed, installed elsewhere, run. A
      # warning here reaches every user — oclif warned on every command, under
      # NODE_ENV=development or test, that it could not find TypeScript.
      - name: Install the packed package and run it
        working-directory: packages/cli
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/user" && cd "$RUNNER_TEMP/user"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/akal-supaforge-*.tgz
          for env in production development test; do
            NODE_ENV=$env npx supaforge --version 2> stderr.txt
            NODE_ENV=$env npx supaforge diff --help > /dev/null 2>> stderr.txt
            if [ -s stderr.txt ]; then echo "::error::NODE_ENV=$env wrote to stderr:"; cat stderr.txt; exit 1; fi
          done
