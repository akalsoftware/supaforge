# SupaForge drift check
# Copy this file to .github/workflows/drift-check.yml in your repository.
# It compares your Supabase environments on every pull request and every
# morning, and fails when production has drifted from what you tested.

name: SupaForge drift check

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Read-only: drift appears as annotations, a job summary and a report artifact.
permissions:
  contents: read

jobs:
  drift-check:
    name: Check for Supabase drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: akalsoftware/supaforge-action@v1
        id: drift
        with:
          # Fail on critical drift; --fail-on=warning or --fail-on=any is stricter.
          args: diff --ci --fail-on=critical
        env:
          # The variables supaforge.config.json reads. Add them under
          # Settings → Secrets and variables → Actions.
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supaforge-drift-report
          path: ${{ steps.drift.outputs.report }}
          if-no-files-found: ignore
